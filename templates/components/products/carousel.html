<div class="sliderWrap">
<section class="productCarousel productCard"
    data-list-name="{{list}}"
    data-slick='{
        "infinite": false,
        "mobileFirst": true,
        "slidesToShow": 2,
        "slidesToScroll": 2,
        "slide": "[data-product-slide]",
        "prevArrow": "{{#if customArrowClass}}.{{customArrowClass}}{{/if}}.js-product-prev-arrow-product",
        "nextArrow": "{{#if customArrowClass}}.{{customArrowClass}}{{/if}}.js-product-next-arrow-product",
        "dots": false,
        "responsive": [
            {
                "breakpoint": 1199,
                "settings": {
                    "slidesToShow": {{ columns }},
                    "slidesToScroll": {{ columns }}
                }
            },
            {
                "breakpoint": 801,
                "settings": {
                    "slidesToShow": 3,
                    "slidesToScroll": 1
                }
            },
            {
                "breakpoint": 575,
                "settings": {
                    "slidesToShow": 2,
                    "slidesToScroll": 1
                }
            },
            {
                "breakpoint": 0,
                "settings": {
                    "slidesToShow": 2,
                    "slidesToScroll": 1
                }
            }
        ]
    }'
>
    {{#each products}}
    <div data-product-slide class="productCarousel-slide">
        {{> components/products/card show_compare=1 settings=../settings theme_settings=../theme_settings customer=../customer event="list" position=(add @index 1)}}
    </div>
    {{/each}}
    {{#if products.length '>' 1}}
        {{> components/carousel-content-announcement}}
    {{/if}}


</section>
<div class="all-btn product-card-button">
    <button class="{{#if customArrowClass}}{{customArrowClass}} {{/if}}js-product-prev-arrow-product slick-prev slick-arrow" aria-label="Preview Button"><svg width="32px" height="18px"><use xlink:href="#arrow-left"></use></svg></button>

    <button class="{{#if customArrowClass}}{{customArrowClass}} {{/if}}js-product-next-arrow-product slick-next slick-arrow" aria-label="Next Button"><svg width="32px" height="18px"><use xlink:href="#arrow-right"></use></svg></button>

</div>
</div>
